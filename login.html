<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickServe - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <!-- Back to Home Button -->
    <a href="./index.html" class="btn-back-home">
      <i class="bi bi-arrow-left"></i> Back to Home
    </a>

    <div class="auth-header text-center">
      <h3 class="brand-title">QUICK<span>SERVE</span></h3>
      <p class="text-muted small">Welcome back! Please login</p>
    </div>

    <!-- Google Login Button -->
    <button type="button" class="btn btn-google w-100 mb-3" id="googleLoginBtn">
      <i class="bi bi-google me-2"></i> Continue with Google
    </button>

    <div class="auth-divider mb-3">
      <span>OR</span>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label text-white-50">Email Address</label>
        <input type="email" id="loginEmail" class="form-control auth-input" placeholder="name@example.com" required>
      </div>

      <div class="mb-4">
        <label class="form-label text-white-50">Password</label>
        <input type="password" id="loginPassword" class="form-control auth-input" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn btn-orange-glow w-100 py-2">Login</button>
    </form>

    <div class="auth-footer text-center mt-4">
      <span class="text-muted small">Don't have an account? </span>
      <a href="./signup.html" class="auth-link">Sign Up</a>
    </div>
  </div>

<script type="module" src="./login.js"></script>
<script type="module" src="./auth-state.js"></script>
</body>
</html>
