<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickServe - My Bookings</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --card-bg: #161a1e;
      --border-color: #262b33;
      --brand-orange: #ff5722;
      --brand-orange-hover: #e64a19;
    }

    body.auth-body { 
      background: radial-gradient(circle at top right, #1a0c08 0%, #0a0a0a 60%), #0a0a0a;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Modern Navbar */
    .custom-navbar {
      background: rgba(13, 17, 23, 0.85) !important;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.5rem;
      color: #ffffff;
      text-decoration: none;
    }
    .brand-title span {
      color: var(--brand-orange);
    }

    /* Filter tabs */
    #filterTabs .btn { 
      color: #a0a0a0; 
      border-color: var(--border-color); 
      background: #14171a; 
      transition: all 0.25s ease;
    }
    #filterTabs .btn:hover { 
      color: #ffffff; 
      border-color: var(--brand-orange); 
    }
    #filterTabs .btn.active {
      background: var(--brand-orange);
      border-color: var(--brand-orange);
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 87, 34, 0.4);
    }

    /* Status badges */
    .status-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.35em 0.75em;
      border-radius: 6px;
      text-transform: capitalize;
      letter-spacing: 0.02em;
    }
    .status-pending     { background: rgba(255, 201, 77, 0.15);  color: #ffc94d; border: 1px solid #ffc94d; }
    .status-accepted    { background: rgba(125, 179, 255, 0.15); color: #7db3ff; border: 1px solid #7db3ff; }
    .status-in-progress { background: rgba(255, 87, 34, 0.15);  color: #ff5722; border: 1px solid #ff5722; }
    .status-completed   { background: rgba(107, 219, 158, 0.15); color: #6bdb9e; border: 1px solid #6bdb9e; }
    .status-rejected    { background: rgba(255, 138, 149, 0.15); color: #ff8a95; border: 1px solid #ff8a95; }

    /* Booking cards */
    .booking-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .booking-card:hover {
      border-color: rgba(255, 87, 34, 0.4);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      transform: translateY(-3px);
    }

    /* Buttons */
    .btn-orange-glow {
      background-color: var(--brand-orange);
      color: #fff;
      border: none;
      box-shadow: 0 0 12px rgba(255, 87, 34, 0.4);
      transition: all 0.3s ease;
    }
    .btn-orange-glow:hover {
      background-color: var(--brand-orange-hover);
      color: #fff;
      box-shadow: 0 0 18px rgba(255, 87, 34, 0.7);
    }

    /* Star rating active state & hover visuals */
    .star-rate { 
      font-size: 2rem; 
      cursor: pointer; 
      color: #333d47; 
      transition: color 0.2s ease, transform 0.2s ease; 
      padding: 0 4px;
    }
    .star-rate.active,
    .star-rate.hovered { 
      color: #ffc107 !important; 
      text-shadow: 0 0 10px rgba(255, 193, 7, 0.6); 
    }
    .star-rate:hover { 
      transform: scale(1.2); 
    }

    /* States */
    #loadingState, #emptyState { color: #a0a0a0; }
    #emptyState { display: none; }
    #emptyState i { color: var(--brand-orange); }

    /* Modal Styling */
    #reviewModal .modal-content {
      background: #12161a;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-radius: 12px;
    }
    #reviewComment { 
      background: #0d1117; 
      border: 1px solid var(--border-color); 
      color: #ffffff; 
    }
    #reviewComment:focus { 
      border-color: var(--brand-orange); 
      box-shadow: 0 0 10px rgba(255, 87, 34, 0.3); 
    }
  </style>
</head>
<body class="auth-body">

  <!-- Dynamic Animated Background Glow -->
  <div style="position: fixed; top: -100px; left: -100px; width: 300px; height: 300px; background: rgba(255,87,34,0.08); filter: blur(100px); border-radius: 50%; pointer-events: none; z-index: 0;"></div>

  <!-- Navbar -->
  <nav class="navbar custom-navbar sticky-top px-3 px-md-5 py-3">
    <a class="navbar-brand brand-title" href="./index.html">QUICK<span>SERVE</span></a>
    <div class="d-flex align-items-center gap-2">
      <a href="./index.html" class="btn btn-sm btn-outline-light">
        <i class="bi bi-house me-1"></i> Home
      </a>
      <button id="logoutBtn" class="btn btn-sm btn-danger">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </button>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container py-4 py-md-5 position-relative" style="z-index: 1;">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3" data-anim="header">
      <div>
        <h3 class="text-white fw-bold mb-1"><i class="bi bi-journal-bookmark me-2 text-warning"></i>My Bookings</h3>
        <p class="text-muted small mb-0">Track and manage the status of all your service requests</p>
      </div>
      <!--
        FIX: "Rejected" tab add ki gai hai (pehle nahi thi), aur ab har
        button ka data-filter EXACT status value hai. customer-dashboard.js
        mein filtering ab isi exact value par hoti hai (pehle fuzzy text
        matching thi jo "Accepted" aur "In Progress" ko aapas mein mila deti thi).
      -->
      <div class="btn-group btn-group-sm flex-wrap" role="group" id="filterTabs">
        <button class="btn active" data-filter="all">All</button>
        <button class="btn" data-filter="pending">Pending</button>
        <button class="btn" data-filter="accepted">Accepted</button>
        <button class="btn" data-filter="in-progress">In Progress</button>
        <button class="btn" data-filter="completed">Completed</button>
        <button class="btn" data-filter="rejected">Rejected</button>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loadingState" class="text-center py-5">
      <div class="spinner-border text-warning mb-3" role="status"></div>
      <p>Loading your bookings...</p>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="text-center py-5">
      <i class="bi bi-calendar-x display-3 mb-3"></i>
      <h5 class="text-white">No Bookings Found</h5>
      <p class="text-muted small">Aap ne abhi tak is category mein koi booking nahi ki hai.</p>
      <a href="./index.html" class="btn btn-orange-glow mt-2">
        <i class="bi bi-search me-1"></i> Browse Services
      </a>
    </div>

    <!-- Bookings Cards Container -->
    <div id="bookingsList" class="row g-3"></div>
  </div>

  <!-- Review Modal -->
  <div class="modal fade" id="reviewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-3">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title text-white fw-bold"><i class="bi bi-star-fill text-warning me-2"></i>Rate your experience</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body py-3">
          <input type="hidden" id="reviewBookingId">
          <!-- Dynamic Star Container -->
          <div class="text-center mb-4" id="starContainer">
            <i class="bi bi-star star-rate" data-value="1"></i>
            <i class="bi bi-star star-rate" data-value="2"></i>
            <i class="bi bi-star star-rate" data-value="3"></i>
            <i class="bi bi-star star-rate" data-value="4"></i>
            <i class="bi bi-star star-rate" data-value="5"></i>
          </div>
          <textarea id="reviewComment" class="form-control rounded-3" rows="3" placeholder="Share a few words about the service (optional)"></textarea>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-orange-glow w-100 py-2 fw-semibold" id="submitReviewBtn">Submit Review</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script type="module" src="./customer-dashboard.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Header GSAP Animation
      if (typeof gsap !== 'undefined') {
        gsap.from('[data-anim="header"]', {
          opacity: 0,
          y: -20,
          duration: 0.6,
          ease: 'power2.out'
        });
      }
    });
  </script>
</body>
</html>
